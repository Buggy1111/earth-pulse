# Refresh deep-space probe trajectory snapshots weekly.
# Satellite TLEs have a dedicated daily workflow; never query the same
# CelesTrak groups again in this weekly workflow.
# Pushing to main triggers a fresh Vercel deploy automatically.
name: Refresh live-data snapshots

on:
  schedule:
    - cron: '0 4 * * 1' # every Monday 04:00 UTC
  workflow_dispatch: {}

concurrency:
  group: earth-pulse-snapshot-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Re-bake probe trajectories from JPL HORIZONS
        run: node scripts/fetch-probes.mjs
      - name: Commit if snapshot changed
        run: |
          FILES="public/probes/probes.json"
          if git diff --quiet -- $FILES; then
            echo "Probe snapshot unchanged."
          else
            git config user.name "data-refresh bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore: refresh weekly probe trajectories (HORIZONS)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
