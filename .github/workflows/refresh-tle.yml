# Refresh short-lived TLE snapshots daily; distant probe trajectories stay weekly.
name: Refresh satellite TLE snapshots

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch: {}

concurrency:
  group: earth-pulse-snapshot-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # A 403 from one CelesTrak group must not prevent refreshing the other.
      # The scripts validate data before writing, so failed downloads leave existing snapshots untouched.
      - name: Refresh Starlink elements
        id: starlink
        continue-on-error: true
        run: node scripts/fetch-starlink.mjs
      - name: Refresh famous satellite elements
        id: famous
        continue-on-error: true
        run: node scripts/fetch-famous.mjs
      - name: Commit refreshed elements
        run: |
          FILES="public/tle/starlink.txt public/tle/famous.txt"
          if git diff --quiet -- $FILES; then
            echo "TLE snapshots unchanged."
          else
            git config user.name "data-refresh bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore: refresh daily satellite TLE snapshots"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      # Preserve a red workflow status if any upstream feed failed, after committing successful updates.
      - name: Report snapshot refresh failures
        if: ${{ always() }}
        env:
          STARLINK_RESULT: ${{ steps.starlink.outcome }}
          FAMOUS_RESULT: ${{ steps.famous.outcome }}
        run: |
          if [ "$STARLINK_RESULT" != "success" ] || [ "$FAMOUS_RESULT" != "success" ]; then
            echo "::error::TLE refresh incomplete (Starlink: $STARLINK_RESULT; famous: $FAMOUS_RESULT). Previous valid snapshots were kept for failed feeds."
            exit 1
          fi
